<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editor de Texto - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container my-5">
    <h1>Editor de Texto</h1>

    <div class="card">
        <div class="card-body">

            <h2>Texto</h2>

            <!-- INPUT -->
            <input type="text" id="input-texto" class="form-control mb-3" placeholder="Escribí tu texto...">

            <!-- TEXTO -->
            <p id="texto">
                Lorem ipsum dolor sit amet, consectetur adipiscing elit.
            </p>

            <hr>

            <h2>Opciones de Formato</h2>

            <div class="row">
                <div class="col-md-3 my-1">
                    <button id="btn-negrita" class="btn w-100 btn-primary" data-formato="negrita">Negrita</button>
                </div>

                <div class="col-md-3 my-1">
                    <button id="btn-cursiva" class="btn w-100 btn-primary" data-formato="cursiva">Cursiva</button>
                </div>

                <div class="col-md-3 my-1">
                    <button id="btn-subrayado" class="btn w-100 btn-primary" data-formato="subrayado">Subrayado</button>
                </div>

                <div class="col-md-3 my-1">
                    <button id="btn-color" class="btn w-100 btn-primary" data-formato="color">Color Rojo</button>
                </div>
            </div>

            <hr>

            <!-- TAMAÑO -->
            <label>Tamaño de texto</label>
            <input type="range" id="tamano" min="12" max="40" value="16" class="form-range">

            <!-- BONUS -->
            <label class="mt-3">Elegir color</label>
            <input type="color" id="color-picker" class="form-control form-control-color">

        </div>
    </div>
</div>

<script>
const texto = document.getElementById("texto");

/* FUNCIONES */
function funcionNegrita() {
    texto.classList.toggle("fw-bold");
    actualizarBoton("btn-negrita", texto.classList.contains("fw-bold"));
}

function funcionCursiva() {
    texto.classList.toggle("fst-italic");
    actualizarBoton("btn-cursiva", texto.classList.contains("fst-italic"));
}

function funcionSubrayado() {
    texto.classList.toggle("text-decoration-underline");
    actualizarBoton("btn-subrayado", texto.classList.contains("text-decoration-underline"));
}

function cambiarColor() {
    texto.classList.toggle("text-danger");
    actualizarBoton("btn-color", texto.classList.contains("text-danger"));
}

/* BOTONES */
function actualizarBoton(id, activo) {
    const btn = document.getElementById(id);
    if (activo) {
        btn.classList.remove("btn-primary");
        btn.classList.add("btn-success");
    } else {
        btn.classList.remove("btn-success");
        btn.classList.add("btn-primary");
    }
}

function handlerBoton(e) {
    const tipo = e.target.dataset.formato;

    switch (tipo) {
        case 'negrita': funcionNegrita(); break;
        case 'cursiva': funcionCursiva(); break;
        case 'subrayado': funcionSubrayado(); break;
        case 'color': cambiarColor(); break;
    }
}

document.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', handlerBoton);
});

/* INPUT TEXTO */
document.getElementById("input-texto").addEventListener("input", function(e) {
    texto.textContent = e.target.value;
});

/* TAMAÑO */
document.getElementById("tamano").addEventListener("input", function(e) {
    texto.style.fontSize = e.target.value + "px";
});

/* COLOR PERSONALIZADO */
document.getElementById("color-picker").addEventListener("input", function(e) {
    texto.style.color = e.target.value;
});
</script>

</body>
</html>
