<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Compras - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-4">
        <h1>Lista de Compras</h1>

        <div class="card">
            <div class="card-body">

                <h2>Listado de Productos</h2>

                <ul id="lista-productos" class="list-group mb-3"></ul>

                <div class="mb-3">
                    <button class="btn btn-danger" onclick="limpiarLista()">Limpiar lista</button>
                    <button class="btn btn-secondary" onclick="ordenarLista()">Ordenar A-Z</button>
                </div>

                <hr>

                <h2>Agregar Producto</h2>
                <form id="form-producto">
                    <div class="input-group">
                        <input type="text" class="form-control" placeholder="Nombre del producto">
                        <button class="btn btn-primary" type="submit">Agregar Producto</button>
                    </div>
                </form>

            </div>
        </div>
    </div>

<script>
let productos = JSON.parse(localStorage.getItem("productos")) || [];

function renderLista() {
    const lista = document.getElementById("lista-productos");
    lista.innerHTML = "";

    productos.forEach((prod, index) => {
        const li = document.createElement("li");
        li.className = "list-group-item d-flex justify-content-between align-items-center";

        const span = document.createElement("span");
        span.textContent = prod.nombre;
        span.style.cursor = "pointer";

        if (prod.comprado) {
            span.style.textDecoration = "line-through";
        }

        span.onclick = () => {
            productos[index].comprado = !productos[index].comprado;
            guardar();
        };

        const divBotones = document.createElement("div");

      
        const btnEliminar = document.createElement("button");
        btnEliminar.className = "btn btn-sm btn-danger me-1";
        btnEliminar.textContent = "X";
        btnEliminar.onclick = () => eliminarProducto(index);
      
        const btnEditar = document.createElement("button");
        btnEditar.className = "btn btn-sm btn-warning";
        btnEditar.textContent = "✏️";
        btnEditar.onclick = () => editarProducto(index);

        divBotones.appendChild(btnEliminar);
        divBotones.appendChild(btnEditar);

        li.appendChild(span);
        li.appendChild(divBotones);

        lista.appendChild(li);
    });

    localStorage.setItem("productos", JSON.stringify(productos));
}

function agregarProducto(nombreProducto) {
    if (nombreProducto.trim() === "") return;

    productos.push({
        nombre: nombreProducto,
        comprado: false
    });

    guardar();
}

function eliminarProducto(index) {
    productos.splice(index, 1);
    guardar();
}

function limpiarLista() {
    productos = [];
    guardar();
}

function ordenarLista() {
    productos.sort((a, b) => a.nombre.localeCompare(b.nombre));
    guardar();
}

function editarProducto(index) {
    const nuevoNombre = prompt("Editar producto:", productos[index].nombre);
    if (nuevoNombre && nuevoNombre.trim() !== "") {
        productos[index].nombre = nuevoNombre;
        guardar();
    }
}

function guardar() {
    localStorage.setItem("productos", JSON.stringify(productos));
    renderLista();
}

function handlerFormulario(evento) {
    evento.preventDefault();
    const input = evento.target.querySelector('input');
    const nombreProducto = input.value;
    input.value = "";
    agregarProducto(nombreProducto);
}

document.querySelector('form').addEventListener('submit', handlerFormulario);

renderLista();
</script>

</body>
</html>
