<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tablero de Puntos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container my-4">
    <h1>Tablero de Puntos</h1>

    <div class="card">
        <div class="card-body">

            <div class="row text-center mb-3">
                <div class="col-5">
                    <input id="nombreLocal" class="form-control text-center mb-2" value="Local">
                    <span id="puntosLocal" class="display-1">0</span>
                </div>
                <div class="col-2">
                    <span class="display-1">:</span>
                </div>
                <div class="col-5">
                    <input id="nombreVisitante" class="form-control text-center mb-2" value="Visitante">
                    <span id="puntosVisitante" class="display-1">0</span>
                </div>
            </div>

            <hr>

            <h2>Actualizar Puntaje</h2>

            <div class="row">
                <div class="col-6 col-md-3 my-1">
                    <button class="btn w-100 btn-success" onclick="sumar('local')">+ Local</button>
                </div>
                <div class="col-6 col-md-3 my-1">
                    <button class="btn w-100 btn-warning" onclick="restar('local')">- Local</button>
                </div>
                <div class="col-6 col-md-3 my-1">
                    <button class="btn w-100 btn-success" onclick="sumar('visitante')">+ Visitante</button>
                </div>
                <div class="col-6 col-md-3 my-1">
                    <button class="btn w-100 btn-warning" onclick="restar('visitante')">- Visitante</button>
                </div>
            </div>

            <div class="row mt-2">
                <div class="col-12 col-md-4 my-1">
                    <button class="btn w-100 btn-secondary" onclick="invertir()">Invertir Puntaje</button>
                </div>
                <div class="col-12 col-md-4 my-1">
                    <button class="btn w-100 btn-danger" onclick="reiniciar()">Reiniciar</button>
                </div>
                <div class="col-12 col-md-4 my-1">
                    <button class="btn w-100 btn-dark" onclick="finalizar()">Finalizar Partido</button>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
let puntosLocal = 0;
let puntosVisitante = 0;
let partidoFinalizado = false;

function actualizarVista() {
    document.getElementById("puntosLocal").textContent = puntosLocal;
    document.getElementById("puntosVisitante").textContent = puntosVisitante;
}

function sumar(equipo) {
    if (partidoFinalizado) return;

    if (equipo === "local") puntosLocal++;
    else puntosVisitante++;

    actualizarVista();
}

function restar(equipo) {
    if (partidoFinalizado) return;

    if (equipo === "local" && puntosLocal > 0) puntosLocal--;
    if (equipo === "visitante" && puntosVisitante > 0) puntosVisitante--;

    actualizarVista();
}

function invertir() {
    if (partidoFinalizado) return;

    let temp = puntosLocal;
    puntosLocal = puntosVisitante;
    puntosVisitante = temp;

    actualizarVista();
}

function reiniciar() {
    puntosLocal = 0;
    puntosVisitante = 0;
    partidoFinalizado = false;

    habilitarBotones();
    actualizarVista();
}

function finalizar() {
    partidoFinalizado = true;
    deshabilitarBotones();
}

function deshabilitarBotones() {
    document.querySelectorAll("button").forEach(btn => {
        if (!btn.textContent.includes("Reiniciar")) {
            btn.disabled = true;
        }
    });
}

function habilitarBotones() {
    document.querySelectorAll("button").forEach(btn => {
        btn.disabled = false;
    });
}
  
document.addEventListener("keydown", (e) => {
    if (partidoFinalizado) return;

    if (e.key === "a") sumar("local");
    if (e.key === "z") restar("local");
    if (e.key === "k") sumar("visitante");
    if (e.key === "m") restar("visitante");
});

actualizarVista();
</script>

</body>
</html>
