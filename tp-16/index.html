<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PokéDex-TP 16</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <!-- ENCABEZADO -->
    <header class="py-4 mb-4">
        <div class="container text-center">
            <h1>PokéDex</h1>
            <p class="mb-0">
                Información de los Pokémon utilizando PokeAPI
            </p>
        </div>
    </header>

    <!-- CONTENIDO -->
    <main class="container">

        <div class="text-center mb-4">
            <h2>Primeros Pokémon</h2>
            <p>
                Explora información sobre los Pokémon de la primera generación.
            </p>
        </div>

        <!-- SPINNER -->
        <div id="spinner" class="text-center my-5">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>

            <p class="mt-3">Cargando Pokémon...</p>
        </div>

        <!-- CARTAS -->
        <div id="pokemon-container" class="row g-4"></div>

        <!-- BOTÓN CARGAR MÁS -->
        <div class="text-center my-5">
            <button id="btn-cargar-mas" class="btn btn-primary">
                Cargar más Pokémon
            </button>
        </div>

    </main>

    <!-- MODAL -->
    <div class="modal fade" id="pokemonModal" tabindex="-1"
        aria-labelledby="pokemonModalLabel" aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="pokemonModalLabel">
                        Información del Pokémon
                    </h5>

                    <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Cerrar">
                    </button>
                </div>

                <div class="modal-body" id="modal-body">
                    <!-- Información agregada mediante JavaScript -->
                </div>

            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript propio -->
    <script src="js/app.js"></script>

</body>

</html>
